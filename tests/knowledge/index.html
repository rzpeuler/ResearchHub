<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResearchHub · AI Hardware Industry Graph</title>
  <style>
    :root { --ink:#172033; --muted:#6b7280; --line:#d7dee9; --canvas:#f4f7fb; --panel:#fff; --blue:#2563eb; --blue-soft:#eaf2ff; --green:#16834f; --amber:#a16207; --purple:#7e3f9b; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--canvas); font:14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font:inherit; }
    .app { min-height:100vh; }
    header { background:#101828; color:#fff; padding:18px 28px 16px; display:flex; justify-content:space-between; align-items:center; gap:18px; }
    header h1 { margin:0; font-size:19px; letter-spacing:.01em; }
    header p { margin:2px 0 0; color:#b8c4d4; font-size:12px; }
    .badge { border:1px solid #52647d; color:#d5e1f0; padding:5px 9px; border-radius:999px; font-size:11px; white-space:nowrap; }
    main { padding:22px 28px 34px; max-width:1500px; margin:0 auto; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .crumb { color:var(--muted); font-size:12px; }
    .crumb button { border:0; background:transparent; color:var(--blue); padding:0; cursor:pointer; }
    .toolbar .spacer { flex:1; }
    .search-panel { display:flex; align-items:center; gap:4px; margin-left:auto; }
    .search-input { width:210px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--ink); background:#fff; }
    .search-input:focus { outline:2px solid #bfd5ff; border-color:var(--blue); }
    .search-count { min-width:42px; color:var(--muted); font-size:11px; text-align:center; }
    .search-button, .icon-button { width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); cursor:pointer; line-height:1; }
    .search-button:hover, .icon-button:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
    .search-button:disabled, .icon-button:disabled { color:#a6b0bf; background:#f5f7fa; cursor:not-allowed; }
    mark.search-hit { background:#ffe58a; color:inherit; border-radius:2px; padding:0 1px; }
    mark.search-hit.current { background:#ff9f43; outline:2px solid #f97316; }
    .layout { display:grid; grid-template-columns:220px minmax(0, 1fr) 360px; gap:16px; align-items:start; }
    .directory-panel { padding:14px 12px; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; }
    .directory-panel h2, .timeline h2, .core-view h2 { margin:0; font-size:15px; }
    .directory-meta { margin:3px 0 12px; color:var(--muted); font-size:11px; }
    .directory-list { display:grid; gap:3px; }
    .directory-item, .directory-graph-item { width:100%; border:0; border-radius:7px; background:transparent; color:var(--ink); cursor:pointer; padding:7px 8px; text-align:left; font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .directory-item:hover, .directory-item.active, .directory-graph-item:hover, .directory-graph-item.active { background:var(--blue-soft); color:var(--blue); }
    .directory-count { color:var(--muted); font-size:10px; }
    .directory-children { margin:0 0 4px 10px; padding-left:8px; border-left:2px solid #dbe7f7; }
    .directory-graph-item { padding:6px 8px; color:#315d98; font-size:11px; }
    .center-column, .right-column { display:flex; flex-direction:column; gap:16px; min-width:0; }
    .right-column { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px rgba(16,24,40,.04); }
    .graph-panel { padding:18px; min-height:500px; }
    .panel-title { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
    .panel-title-left { min-width:0; }
    .panel-title h2 { margin:0; font-size:16px; }
    .panel-title span { color:var(--muted); font-size:12px; }
    .nav-actions { display:flex; align-items:center; gap:6px; }
    .graph { display:flex; flex-wrap:wrap; align-items:stretch; gap:12px; min-height:385px; padding:12px; border:1px dashed #bfccdd; border-radius:13px; background:linear-gradient(135deg,#f8fbff,#f5f8fc); }
    .node { flex:1 1 145px; min-width:145px; min-height:142px; border:2px solid #9db6d6; border-radius:13px; background:#eef5ff; padding:13px; cursor:pointer; position:relative; overflow:hidden; transition:.15s ease; }
    .node:hover, .node.selected { border-color:var(--blue); transform:translateY(-2px); box-shadow:0 7px 18px rgba(37,99,235,.13); }
    .node h3 { margin:0 0 4px; font-size:15px; }
    .node small { color:var(--muted); }
    .node .children { display:flex; flex-wrap:wrap; gap:4px; margin-top:13px; }
    .mini { background:#fff; border-radius:7px; padding:3px 6px; color:#48617d; font-size:10px; }
    .details-panel { padding:18px; }
    .details-panel h2 { margin:0; font-size:18px; }
    .details-panel h3 { margin:0 0 7px; font-size:12px; }
    .details-panel section { border-top:1px solid var(--line); margin-top:15px; padding-top:14px; }
    .details-panel section:first-of-type { border-top:0; margin-top:12px; padding-top:0; }
    .eyebrow { color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
    .meta { color:var(--muted); font-size:12px; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; }
    .chip { background:#f0f4f9; color:#4e6179; border-radius:999px; padding:3px 7px; font-size:11px; }
    .chip.private { background:#fff2d8; color:#9a6700; }
    .row { padding:8px 0; border-bottom:1px solid #edf0f5; font-size:12px; }
    .row:last-child { border-bottom:0; }
    .row b { display:block; }
    .link { color:var(--blue); text-decoration:none; }
    .link:hover { text-decoration:underline; }
    .stat { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .stat div { background:#f7f9fc; border-radius:8px; padding:8px; }
    .stat strong { display:block; font-size:16px; }
    .market-share { display:flex; flex-wrap:wrap; gap:7px; align-items:stretch; }
    .share-card { min-height:115px; min-width:0; flex:var(--share) 1 110px; background:#dcecff; border-radius:10px; padding:9px; font-size:11px; border:1px solid rgba(37,99,235,.13); cursor:pointer; }
    .share-card.selected { outline:2px solid var(--blue); outline-offset:1px; }
    .share-card:nth-child(2n) { background:#dff5e8; }
    .share-card:nth-child(3n) { background:#fff0d9; }
    .share-card b { font-size:13px; }
    .knowledge-intro { color:#40516a; margin:0; }
    .forecast-chart { display:flex; align-items:flex-end; gap:9px; min-height:150px; padding:12px 8px 0; border:1px solid #e6ebf2; border-radius:10px; background:#fbfcfe; }
    .forecast-item { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; min-width:42px; height:130px; }
    .forecast-bar { width:100%; max-width:44px; min-height:8px; border-radius:7px 7px 2px 2px; background:linear-gradient(180deg,#4f8df7,#b9d3ff); }
    .forecast-value, .forecast-label { color:var(--muted); font-size:10px; text-align:center; }
    .data-table-wrap { overflow:auto; border:1px solid #e6ebf2; border-radius:10px; }
    .data-table { width:100%; min-width:520px; border-collapse:collapse; font-size:11px; }
    .data-table th, .data-table td { padding:8px 9px; border-bottom:1px solid #edf0f5; text-align:left; vertical-align:top; }
    .data-table th { color:#52647d; background:#f7f9fc; font-weight:600; white-space:nowrap; }
    .data-table tr:last-child td { border-bottom:0; }
    .data-table tr.selected-row td, .data-table tr[data-company]:hover td { background:#eef5ff; }
    .data-table tr[data-company] { cursor:pointer; }
    .empty { color:var(--muted); padding:30px 12px; text-align:center; }
    .core-view-panel, .timeline { margin:0; padding:16px 18px; }
    .core-view h2 { margin-bottom:9px; }
    .core-view-target { color:var(--muted); font-size:11px; margin-bottom:9px; }
    .core-view-grid { display:grid; gap:7px; }
    .core-view-block { padding:8px 9px; border-radius:8px; background:#f7f9fc; border-left:3px solid #93a4ba; }
    .core-view-block.bullish { border-left-color:#16834f; background:#f0faf4; }
    .core-view-block.bearish { border-left-color:#c47b0a; background:#fff8e8; }
    .core-view-block.variables { border-left-color:#2563eb; background:#f2f6ff; }
    .core-view-block h3 { margin:0 0 4px; font-size:11px; }
    .core-view-block ul { margin:0; padding-left:16px; color:#40516a; font-size:11px; }
    .core-view-block li + li { margin-top:3px; }
    .timeline h2 { margin-bottom:5px; }
    .events { position:relative; }
    .timeline-plot { position:relative; height:var(--plot-height); margin:12px 0 0; padding-left:52px; }
    .timeline-rail { position:absolute; left:28px; top:0; bottom:0; width:3px; border-radius:999px; background:#c4d1e3; }
    .timeline-scale { position:absolute; inset:0 auto 0 0; width:43px; color:var(--muted); font-size:10px; }
    .timeline-scale span { position:absolute; left:0; transform:translateY(-50%); white-space:nowrap; }
    .timeline-scale span::after { content:""; position:absolute; left:39px; top:50%; width:9px; height:1px; background:#a9bbd3; }
    .timeline-event { position:absolute; left:52px; right:0; min-height:84px; padding:10px 11px 10px 15px; border:1px solid #e2e8f1; border-radius:9px; background:#f7f9fc; box-shadow:0 2px 8px rgba(16,24,40,.03); }
    .event-point { position:absolute; left:-31px; top:14px; width:13px; height:13px; border:3px solid #2563eb; border-radius:50%; background:#fff; box-shadow:0 0 0 3px #eaf2ff; }
    .event-point::after { content:""; position:absolute; left:10px; top:3px; width:17px; height:2px; background:#8fb8ff; }
    .event-impact { display:inline-block; margin-left:5px; padding:2px 6px; border-radius:999px; background:#eaf2ff; color:#2563eb; font-size:10px; vertical-align:1px; }
    .timeline-event time { color:var(--muted); font-size:11px; }
    .timeline-event b { display:block; margin:3px 0; }
    .timeline-event p { color:var(--muted); margin:0; font-size:12px; }
    .note { margin-top:12px; color:var(--muted); font-size:11px; }
    @media (max-width:1200px) { .layout { grid-template-columns:190px minmax(0, 1fr) 320px; } }
    @media (max-width:1000px) { .layout { grid-template-columns:1fr; } .directory-panel, .right-column { position:static; max-height:none; overflow:visible; } }
    @media (max-width:640px) { header, main { padding-left:14px; padding-right:14px; } .graph-panel { padding:12px; } .node { min-width:125px; } }
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>ResearchHub Knowledge Layer · AI Hardware Industry Graph</h1><p>Production Knowledge · Entity / Relation / Intelligence / Module</p></div><span class="badge">Read-only Production View</span></header>
  <main>
    <div class="toolbar"><div id="breadcrumbs" class="crumb"></div><div class="spacer"></div><div id="searchPanel" class="search-panel" role="search"><input id="pageSearch" class="search-input" type="search" placeholder="搜索页面内容" aria-label="搜索页面内容" autocomplete="off"><span id="searchCount" class="search-count" aria-live="polite">—</span><button id="searchPrev" class="search-button" type="button" title="上一个匹配" aria-label="上一个匹配">↑</button><button id="searchNext" class="search-button" type="button" title="下一个匹配" aria-label="下一个匹配">↓</button><button id="searchClear" class="search-button" type="button" title="清除搜索" aria-label="清除搜索">×</button></div></div>
    <div class="layout"><aside class="panel directory-panel"><h2>图谱目录</h2><p id="directoryMeta" class="directory-meta">申万一级行业</p><div id="industryDirectory" class="directory-list"></div></aside><div class="center-column"><section class="panel graph-panel"><div class="panel-title"><div class="panel-title-left"><div><h2 id="graphTitle"></h2><span id="graphSubtitle"></span></div></div><div class="nav-actions"><button id="homeButton" class="icon-button" type="button" title="返回产业全景" aria-label="返回产业全景">⌂</button><button id="backButton" class="icon-button" type="button" title="上一级" aria-label="上一级">←</button><button id="enterButton" class="icon-button" type="button" title="进入下一级" aria-label="进入下一级">→</button></div></div><div id="graph" class="graph"></div><p class="note">点击节点查看详情；选择有下级环节的节点后可进入下一层。</p></section><section id="details" class="panel details-panel"></section></div><aside class="right-column"><section class="panel core-view-panel"><div id="coreView" class="core-view"><h2 id="coreViewTitle">核心观点</h2><div id="coreViewContent"></div></div></section><section class="panel timeline"><h2 id="timelineTitle">事件时间轴</h2><p id="timelineSubtitle" class="meta">事件按发生日期定位。</p><div id="events" class="events"></div></section></aside></div>
  </main>
</div>
<script>
  const state = { directory: null, graph: null, detail: null, companyDetail: null, directoryIndustryId: 'sw:electronics', directoryGraphId: 'industry:ai-hardware', focusId: 'industry:ai-hardware', selectedId: 'industry:ai-hardware', selectedCompanyId: null, pathIds: ['industry:ai-hardware'], entities: new Map(), searchQuery: '', searchMatchIndex: 0, searchMatches: [] };
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
  const valueText = (value) => Array.isArray(value) ? value.join('、') : value && typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
  const apiGet = async (path) => { const response = await fetch(path); const body = await response.json(); if (!response.ok) throw new Error(body.error || `Request failed: ${response.status}`); return body; };
  const entityName = (id) => state.entities.get(id)?.name || id;
  const detailSectionEnabled = (section) => state.detail?.viewSections?.includes(section);

  function rememberGraph(graph) { [graph.root, ...graph.children].forEach((item) => state.entities.set(item.id, item)); }
  function rememberDetail(detail) { state.entities.set(detail.entity.id, detail.entity); detail.relatedCompanies.forEach(({ company }) => state.entities.set(company.id, company)); }
  function clearSearchHighlights() { document.querySelectorAll('mark.search-hit').forEach((mark) => { const parent = mark.parentNode; if (parent) { parent.replaceChild(document.createTextNode(mark.textContent || ''), mark); parent.normalize(); } }); state.searchMatches = []; }
  function updateSearchControls() { const hasMatches = state.searchMatches.length > 0; $('#searchCount').textContent = state.searchQuery.trim() ? `${hasMatches ? state.searchMatchIndex + 1 : 0}/${state.searchMatches.length}` : '—'; $('#searchPrev').disabled = !hasMatches; $('#searchNext').disabled = !hasMatches; }
  function focusSearchMatch(index) { if (!state.searchMatches.length) { updateSearchControls(); return; } state.searchMatchIndex = (index + state.searchMatches.length) % state.searchMatches.length; state.searchMatches.forEach((match, i) => match.classList.toggle('current', i === state.searchMatchIndex)); state.searchMatches[state.searchMatchIndex].scrollIntoView({ behavior:'smooth', block:'center' }); updateSearchControls(); }
  function refreshSearchHighlights() {
    clearSearchHighlights(); const query = state.searchQuery.trim(); if (!query) { updateSearchControls(); return; }
    const walker = document.createTreeWalker(document.body, 4); const nodes = []; let node;
    while ((node = walker.nextNode())) if (!node.parentElement?.closest('#searchPanel,script,style')) nodes.push(node);
    const lowered = query.toLocaleLowerCase();
    nodes.forEach((textNode) => { const value = textNode.nodeValue || ''; const lower = value.toLocaleLowerCase(); let cursor = 0; let start = lower.indexOf(lowered, cursor); if (start < 0) return; const fragment = document.createDocumentFragment(); while (start >= 0) { if (start > cursor) fragment.appendChild(document.createTextNode(value.slice(cursor, start))); const mark = document.createElement('mark'); mark.className = 'search-hit'; mark.textContent = value.slice(start, start + query.length); fragment.appendChild(mark); state.searchMatches.push(mark); cursor = start + query.length; start = lower.indexOf(lowered, cursor); } if (cursor < value.length) fragment.appendChild(document.createTextNode(value.slice(cursor))); textNode.parentNode?.replaceChild(fragment, textNode); });
    state.searchMatchIndex = 0; focusSearchMatch(0);
  }

  function renderDirectory() {
    const industries = state.directory?.industries || []; $('#directoryMeta').textContent = `${state.directory?.classification || '申万一级行业'} · ${industries.length} 个行业`;
    $('#industryDirectory').innerHTML = industries.map((industry) => { const active = industry.id === state.directoryIndustryId ? ' active' : ''; const graphs = industry.graphs || []; const graphHtml = graphs.length ? `<div class="directory-children">${graphs.map((graph) => `<button class="directory-graph-item${state.directoryGraphId === graph.id ? ' active' : ''}" type="button" data-directory-graph="${escapeHtml(graph.id)}" data-directory-industry="${escapeHtml(industry.id)}"><span>${escapeHtml(graph.name)}</span><span class="directory-count">图谱</span></button>`).join('')}</div>` : ''; return `<div class="directory-group"><button class="directory-item${active}" type="button" data-directory-industry="${escapeHtml(industry.id)}"><span>${escapeHtml(industry.name)}</span>${graphs.length ? `<span class="directory-count">${graphs.length}</span>` : ''}</button>${graphHtml}</div>`; }).join('');
    document.querySelectorAll('[data-directory-industry]').forEach((button) => button.addEventListener('click', async () => { const industry = industries.find((item) => item.id === button.dataset.directoryIndustry); state.directoryIndustryId = button.dataset.directoryIndustry; const graph = industry?.graphs?.[0]; if (graph) await openGraph(graph.id); else { state.directoryGraphId = null; state.focusId = null; state.selectedId = null; state.detail = null; state.graph = null; state.companyDetail = null; state.pathIds = []; render(); } }));
    document.querySelectorAll('[data-directory-graph]').forEach((button) => button.addEventListener('click', async () => { state.directoryIndustryId = button.dataset.directoryIndustry; await openGraph(button.dataset.directoryGraph); }));
  }

  function renderBreadcrumbs() { $('#breadcrumbs').innerHTML = state.pathIds.map((id, index) => `<button data-focus="${escapeHtml(id)}">${escapeHtml(entityName(id))}</button>${index < state.pathIds.length - 1 ? ' / ' : ''}`).join(''); document.querySelectorAll('[data-focus]').forEach((button) => button.addEventListener('click', async () => { const index = state.pathIds.indexOf(button.dataset.focus); state.pathIds = state.pathIds.slice(0, index + 1); state.focusId = button.dataset.focus; state.selectedId = button.dataset.focus; state.selectedCompanyId = null; state.companyDetail = null; await loadFocusedGraph(); })); }

  function renderGraph() {
    if (!state.directoryGraphId || !state.graph) { $('#graphTitle').textContent = state.directory?.industries?.find((item) => item.id === state.directoryIndustryId)?.name || '申万一级行业'; $('#graphSubtitle').textContent = '当前行业暂无可用图谱'; $('#backButton').disabled = true; $('#enterButton').disabled = true; $('#graph').innerHTML = '<div class="empty">当前一级行业暂无可用产业图谱。</div>'; return; }
    const graph = state.graph; $('#graphTitle').textContent = entityName(state.focusId); $('#graphSubtitle').textContent = `${graph.children.length} 个关联环节`;
    const selected = graph.children.some((item) => item.id === state.selectedId) ? state.selectedId : state.focusId; const selectedNode = graph.children.find((item) => item.id === state.selectedId); $('#backButton').disabled = state.pathIds.length <= 1; $('#enterButton').disabled = !selectedNode?.hasChildren;
    $('#graph').innerHTML = graph.children.length ? graph.children.map((item) => { const selectedClass = item.id === state.selectedId ? ' selected' : ''; return `<article class="node${selectedClass}" data-node="${escapeHtml(item.id)}"><h3>${escapeHtml(item.name)}</h3><small>${escapeHtml(item.type)}${item.hasChildren ? ' · 含下级环节' : ''}</small></article>`; }).join('') : `<div class="empty">${selected === state.focusId ? '当前节点暂无下级环节。' : '当前节点暂无可展示的下级环节。'}</div>`;
    document.querySelectorAll('[data-node]').forEach((node) => node.addEventListener('click', () => selectNode(node.dataset.node)));
  }

  function renderForecast(forecasts) { const forecast = forecasts[0]; if (!forecast || !detailSectionEnabled('forecast')) return ''; const values = forecast.values && typeof forecast.values === 'object' ? Object.entries(forecast.values) : []; if (!values.length) return ''; const max = Math.max(...values.map(([, value]) => Number(value) || 0), 1); return `<section><h3>市场规模预测</h3><div class="forecast-chart">${values.map(([period, value]) => `<div class="forecast-item"><span class="forecast-value">${escapeHtml(value)}<br>${escapeHtml(forecast.unit)}</span><div class="forecast-bar" style="height:${Math.max((Number(value) / max) * 100, 8)}%" title="${escapeHtml(period)}"></div><span class="forecast-label">${escapeHtml(period)}</span></div>`).join('')}</div><p class="meta">${escapeHtml(forecast.metric)} · ${escapeHtml(forecast.period)}</p></section>`; }
  function renderComparison(modules) { if (!detailSectionEnabled('comparison') || !modules.length) return ''; const module = modules[0]; const columns = Array.isArray(module.columns) ? module.columns : []; const rows = Array.isArray(module.rows) ? module.rows : []; if (!columns.length || !rows.length) return ''; return `<section><h3>细分产品对比</h3><div class="data-table-wrap"><table class="data-table"><thead><tr>${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => { const record = row && typeof row === 'object' ? row : {}; return `<tr>${columns.map((column) => `<td>${escapeHtml(valueText(record[column]))}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div><p class="meta">${escapeHtml(module.schemaId || module.id)}</p></section>`; }
  function renderMarketShare(marketShare) { if (!detailSectionEnabled('market-share') || !marketShare) return ''; const entries = marketShare.entries; return `<section><h3>市场份额</h3><p class="meta">业务口径：${escapeHtml(entries[0]?.revenueScope)} · 业务收入合计 ${escapeHtml(marketShare.totalRevenue)}</p><div class="market-share">${entries.map((entry) => { const share = marketShare.totalRevenue ? entry.segmentRevenue / marketShare.totalRevenue : 0; return `<div class="share-card" data-company="${escapeHtml(entry.company.id)}" style="--share:${Math.max(share * 100, 10)}"><b>${escapeHtml(entry.company.name)}</b><br>业务收入 ${escapeHtml(entry.segmentRevenue)}<br>市场份额 ${(share * 100).toFixed(0)}%</div>`; }).join('')}</div><div class="data-table-wrap" style="margin-top:10px"><table class="data-table"><thead><tr><th>企业</th><th>业务收入</th><th>市场份额</th></tr></thead><tbody>${entries.map((entry) => { const share = marketShare.totalRevenue ? entry.segmentRevenue / marketShare.totalRevenue : 0; return `<tr data-company="${escapeHtml(entry.company.id)}"><td>${escapeHtml(entry.company.name)}</td><td>${escapeHtml(entry.segmentRevenue)}</td><td>${(share * 100).toFixed(0)}%</td></tr>`; }).join('')}</tbody></table></div></section>`; }
  function renderCompanies(relatedCompanies) { if (!detailSectionEnabled('companies') || !relatedCompanies.length) return ''; return `<section><h3>关联公司</h3><div class="data-table-wrap"><table class="data-table"><thead><tr><th>企业</th><th>上市状态</th><th>股票代码</th><th>细分产品</th><th>客户群体</th></tr></thead><tbody>${relatedCompanies.map(({ company }) => { const metadata = company.metadata || {}; return `<tr data-company="${escapeHtml(company.id)}"><td><b>${escapeHtml(company.name)}</b></td><td>${company.listingStatus === 'private' ? '<span class="chip private">非上市公司</span>' : '<span class="chip">上市公司</span>'}</td><td>${escapeHtml(company.ticker || '—')}</td><td>${escapeHtml(valueText(metadata.productTypes) || '—')}</td><td>${escapeHtml(valueText(metadata.customerSegments) || '—')}</td></tr>`; }).join('')}</tbody></table></div><p class="meta">点击企业查看下方详情。</p></section>`; }
  function renderSources(sources) { if (!detailSectionEnabled('sources') || !sources.length) return ''; return `<section><h3>相关来源</h3>${sources.map((source) => `<div class="row"><b>${escapeHtml(source.title)}</b><span class="meta">${escapeHtml(source.publisher)} · ${escapeHtml(source.publishedAt)}</span>${source.url ? `<br><a class="link" href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">打开来源 ↗</a>` : ''}</div>`).join('')}</section>`; }
  function renderCompanyDetail(detail) { if (!detail) return ''; const company = detail.entity; const metadata = company.metadata || {}; const metrics = detail.facts.filter((item) => item.category === 'financial_metric'); const groups = [['细分产品', metadata.productTypes], ['客户群体', metadata.customerSegments]]; return `<section><h3>公司详情 · ${escapeHtml(company.name)}</h3><div class="stat"><div><span class="meta">上市状态</span><strong>${company.listingStatus === 'private' ? '非上市' : '上市'}</strong><span class="meta">${escapeHtml(company.ticker || '—')} ${escapeHtml(company.exchange || '')}</span></div><div><span class="meta">财务事实</span><strong>${metrics.length}</strong><span class="meta">来自 Intelligence</span></div></div>${groups.map(([label, values]) => `<div class="row"><b>${label}</b><div class="chips">${(Array.isArray(values) ? values : []).map((value) => `<span class="chip">${escapeHtml(value)}</span>`).join('') || '<span class="meta">暂无可用信息</span>'}</div></div>`).join('')}${metrics.map((item) => `<div class="row"><b>${escapeHtml(item.metric)}</b><span>${escapeHtml(item.value)} ${escapeHtml(item.unit)} · ${escapeHtml(item.period)}</span></div>`).join('')}${renderSources(detail.sources)}</section>`; }

  function renderDetails() {
    const detail = state.detail; if (!detail) { $('#details').innerHTML = '<div class="empty">请选择一个可用图谱。</div>'; return; }
    const entity = detail.entity; const childrenHtml = detail.children.length ? `<section><h3>下级环节</h3><div class="chips">${detail.children.map((child) => `<span class="chip">${escapeHtml(child.name)}</span>`).join('')}</div></section>` : ''; const intro = entity.description ? `<section><h3>行业简介</h3><p class="knowledge-intro">${escapeHtml(entity.description)}</p></section>` : ''; const header = `<div class="eyebrow">${escapeHtml(entity.type)}</div><h2>${escapeHtml(entity.name)}</h2><p class="meta">${escapeHtml(entity.id)}</p>`; $('#details').innerHTML = header + intro + renderForecast(detail.forecasts) + renderComparison(detail.modules) + childrenHtml + renderMarketShare(detail.marketShare) + renderCompanies(detail.relatedCompanies) + (state.companyDetail ? renderCompanyDetail(state.companyDetail) : '') + renderSources(detail.sources); document.querySelectorAll('[data-company]').forEach((node) => node.addEventListener('click', () => selectCompany(node.dataset.company))); }

  function renderCoreView(detail) { const viewpoint = detail?.viewpoints?.[0]; $('#coreViewTitle').textContent = detail?.entity ? `核心观点 · ${detail.entity.name}` : '核心观点'; if (!viewpoint) { $('#coreViewContent').innerHTML = '<div class="empty">当前节点暂无可用核心观点。</div>'; return; } const groups = [['bullishPoints', '看多观点', 'bullish'], ['bearishPoints', '看空观点', 'bearish'], ['keyVariables', '关键变量', 'variables']]; const blocks = groups.map(([key, label, className]) => { const values = Array.isArray(viewpoint[key]) ? viewpoint[key] : []; return values.length ? `<div class="core-view-block ${className}"><h3>${label}</h3><ul>${values.map((value) => `<li>${escapeHtml(value)}</li>`).join('')}</ul></div>` : ''; }).join(''); $('#coreViewContent').innerHTML = blocks || '<div class="empty">当前节点暂无可用核心观点。</div>'; }

  function renderEvents(detail) { const events = detailSectionEnabled('event-timeline') ? (detail?.events || []) : []; const target = detail?.entity?.name || '当前节点'; $('#timelineTitle').textContent = `事件时间轴 · ${target}`; $('#timelineSubtitle').textContent = `${events.length} 个事件点，按发生日期定位。`; if (!events.length) { $('#events').innerHTML = '<div class="empty">当前节点暂无可用事件。</div>'; return; } const day = 86400000; const parseDate = (value) => /^\d{4}$/.test(value) ? Date.parse(`${value}-07-01T00:00:00Z`) : Date.parse(`${value}T00:00:00Z`); const dates = events.map((event) => parseDate(event.occurredAt)); const min = Math.min(...dates); const max = Math.max(...dates); const span = Math.max(max - min, day); const height = Math.max(300, Math.min(700, 180 + span / day * 1.15)); const label = (value) => new Date(value).toISOString().slice(0, 10); const positions = dates.map((date) => 28 + ((date - min) / span) * (height - 56)); const rows = events.map((event, index) => `<article class="timeline-event" style="top:${positions[index]}px"><div class="event-point" title="${escapeHtml(event.occurredAt)}"></div><time>${escapeHtml(event.occurredAt)}</time><b>${escapeHtml(event.id)}<span class="event-impact">${escapeHtml(event.impact || '事件')}</span></b><p>${escapeHtml(event.statement)}</p></article>`).join(''); $('#events').innerHTML = `<div class="timeline-plot" style="--plot-height:${height}px"><div class="timeline-rail"></div><div class="timeline-scale"><span style="top:0">${label(min)}</span><span style="top:50%">${label(min + span / 2)}</span><span style="top:100%">${label(max)}</span></div>${rows}</div>`; }

  function render() { renderDirectory(); renderBreadcrumbs(); renderGraph(); renderDetails(); renderCoreView(state.companyDetail || state.detail); renderEvents(state.companyDetail || state.detail); refreshSearchHighlights(); }
  async function loadFocusedGraph() { if (!state.directoryGraphId || !state.focusId) { state.graph = null; state.detail = null; render(); return; } try { const [graph, detail] = await Promise.all([apiGet(`/api/knowledge/graph/${encodeURIComponent(state.focusId)}`), apiGet(`/api/knowledge/entity/${encodeURIComponent(state.selectedId || state.focusId)}`)]); state.graph = graph; state.detail = detail; state.companyDetail = null; rememberGraph(graph); rememberDetail(detail); render(); } catch (error) { $('#graph').innerHTML = `<div class="empty">无法读取 Production Knowledge：${escapeHtml(error.message)}</div>`; } }
  async function openGraph(graphId) { state.directoryGraphId = graphId; state.focusId = graphId; state.selectedId = graphId; state.selectedCompanyId = null; state.companyDetail = null; state.pathIds = [graphId]; await loadFocusedGraph(); }
  async function selectNode(entityId) { state.selectedId = entityId; state.selectedCompanyId = null; state.companyDetail = null; try { state.detail = await apiGet(`/api/knowledge/entity/${encodeURIComponent(entityId)}`); rememberDetail(state.detail); render(); } catch (error) { $('#details').innerHTML = `<div class="empty">无法读取节点信息：${escapeHtml(error.message)}</div>`; } }
  async function selectCompany(companyId) { state.selectedCompanyId = companyId; try { state.companyDetail = await apiGet(`/api/knowledge/entity/${encodeURIComponent(companyId)}`); rememberDetail(state.companyDetail); render(); } catch (error) { $('#details').innerHTML = `<div class="empty">无法读取公司信息：${escapeHtml(error.message)}</div>`; } }
  async function goBack() { if (state.pathIds.length <= 1) return; state.pathIds.pop(); state.focusId = state.pathIds[state.pathIds.length - 1]; state.selectedId = state.focusId; state.selectedCompanyId = null; await loadFocusedGraph(); }
  async function enterSelected() { const node = state.graph?.children.find((item) => item.id === state.selectedId); if (!node?.hasChildren) return; state.focusId = node.id; state.pathIds = [...state.pathIds.slice(0, state.pathIds.indexOf(node.id) + 1), node.id]; state.selectedId = node.id; state.selectedCompanyId = null; await loadFocusedGraph(); }
  function resetToHome() { openGraph('industry:ai-hardware'); }

  $('#homeButton').addEventListener('click', resetToHome); $('#backButton').addEventListener('click', goBack); $('#enterButton').addEventListener('click', enterSelected); $('#pageSearch').addEventListener('input', (event) => { state.searchQuery = event.target.value; state.searchMatchIndex = 0; refreshSearchHighlights(); }); $('#pageSearch').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); focusSearchMatch(state.searchMatchIndex + (event.shiftKey ? -1 : 1)); } if (event.key === 'Escape') { event.target.value = ''; state.searchQuery = ''; refreshSearchHighlights(); } }); $('#searchPrev').addEventListener('click', () => focusSearchMatch(state.searchMatchIndex - 1)); $('#searchNext').addEventListener('click', () => focusSearchMatch(state.searchMatchIndex + 1)); $('#searchClear').addEventListener('click', () => { $('#pageSearch').value = ''; state.searchQuery = ''; refreshSearchHighlights(); $('#pageSearch').focus(); });
  apiGet('/api/knowledge/directory').then((directory) => { state.directory = directory; return openGraph('industry:ai-hardware'); }).catch((error) => { $('#graph').innerHTML = `<div class="empty">无法读取 Production Knowledge：${escapeHtml(error.message)}</div>`; });
</script>
</body>
</html>
